<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <script src="../ag-theme.js"></script>
  <meta name="theme-color" content="#a78bfa" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#6d28d9" media="(prefers-color-scheme: light)">
  <meta property="og:site_name" content="Untitled page">
  <meta property="og:title" content="Blog">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Blog">
  <style>
  /* Generated from the element tree. This file is rewritten on every compile. */

  *, *::before, *::after { box-sizing: border-box; }

  body { margin: 0; }

  a { color: inherit; font: inherit; }

  @font-face {
    font-family: 'Fiendish';
    src: url('Fiendish.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --ag-accent: #a78bfa;
    --ag-accent-ink: #0e0817;
    --ag-accent-tint: #a78bfa1f;
    --ag-bg: #0e0817;
    --ag-danger: #f87171;
    --ag-font-body: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-heading: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-title: "Fiendish", "Maven Pro Medium", system-ui, sans-serif;
    --ag-hairline: #a78bfa2e;
    --ag-hero: url("assets/images/web-words-dark.webp");
    --ag-ink: #ffffff;
    --ag-ink-muted: #a49cc4;
    --ag-ok: #34d399;
    --ag-panel: #161023;
    --ag-radius-box: clamp(12px, 1.2vw, 20px);
    --ag-shadow-float: 0 1.2vw 3.4vw #000000bf;
    --ag-wallpaper: url("assets/images/bg-dark.webp");
    --ag-warning: #fbbf24;
  }

  [data-theme="light"] {
    --ag-accent: #6d28d9;
    --ag-accent-ink: #ffffff;
    --ag-accent-tint: #7c5cd614;
    --ag-bg: #efeaf8;
    --ag-danger: #b91c1c;
    --ag-font-body: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-heading: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-title: "Fiendish", "Maven Pro Medium", system-ui, sans-serif;
    --ag-hairline: #6d5aa833;
    --ag-hero: url("assets/images/web-words-light.webp");
    --ag-ink: #191233;
    --ag-ink-muted: #575073;
    --ag-ok: #047857;
    --ag-panel: #fbf9ff;
    --ag-radius-box: clamp(12px, 1.2vw, 20px);
    --ag-shadow-float: 0 1.2vw 3.4vw #4c3f7a59;
    --ag-wallpaper: url("assets/images/bg-light.webp");
    --ag-warning: #b45309;
  }

  .el-D-1 {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    min-height: 100vh;
  }
  </style>
</head>
<body>
<div class="el-D-1" data-el-id="D-1"></div>
</body>
</html>
