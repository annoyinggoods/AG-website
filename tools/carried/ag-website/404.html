<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <script src="ag-theme.js"></script>
  <style>
  :root {
    --ag-accent: #a78bfa;
    --ag-accent-ink: #0e0817;
    --ag-accent-tint: #a78bfa1f;
    --ag-bg: #0e0817;
    --ag-danger: #f87171;
    --ag-font-body: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-heading: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-title: "Fiendish", "Maven Pro Medium", system-ui, sans-serif;
    --ag-hairline: #a78bfa2e;
    --ag-hero: url("assets/images/web-words-dark.webp");
    --ag-ink: #ffffff;
    --ag-ink-muted: #a49cc4;
    --ag-ok: #34d399;
    --ag-panel: #161023;
    --ag-radius-box: clamp(12px, 1.2vw, 20px);
    --ag-shadow-float: 0 1.2vw 3.4vw #000000bf;
    --ag-wallpaper: url("assets/images/bg-dark.webp");
    --ag-warning: #fbbf24;
  }

  [data-theme="light"] {
    --ag-accent: #6d28d9;
    --ag-accent-ink: #ffffff;
    --ag-accent-tint: #7c5cd614;
    --ag-bg: #efeaf8;
    --ag-danger: #b91c1c;
    --ag-font-body: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-heading: "Maven Pro Medium", system-ui, sans-serif;
    --ag-font-title: "Fiendish", "Maven Pro Medium", system-ui, sans-serif;
    --ag-hairline: #6d5aa833;
    --ag-hero: url("assets/images/web-words-light.webp");
    --ag-ink: #191233;
    --ag-ink-muted: #575073;
    --ag-ok: #047857;
    --ag-panel: #fbf9ff;
    --ag-radius-box: clamp(12px, 1.2vw, 20px);
    --ag-shadow-float: 0 1.2vw 3.4vw #4c3f7a59;
    --ag-wallpaper: url("assets/images/bg-light.webp");
    --ag-warning: #b45309;
  }
  .ag-not-found {
    max-width: 40rem;
    margin: 4rem auto;
    padding: 0 1.5rem;
    font-family: var(--ag-font-body), system-ui, sans-serif;
    line-height: 1.6;
  }
  </style>
</head>
<body>
<main class="ag-not-found">
  <h1>Page not found</h1>
  <p>The address you followed does not name a page of this site.</p>
  <p><a href="/index.html">Go to the home page</a></p>
</main>
</body>
</html>
